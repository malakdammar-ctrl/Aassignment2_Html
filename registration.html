<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Member Registration</title>
</head>
<body>

    <h1>Create Your Account</h1>
    <p>Please fill in the form below to complete your registration.</p>

    <form action="/register" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend>1. Account &amp; Personal Details</legend>

            <div>
                <label for="user_name">Full Name:</label>
                <input type="text" id="user_name" name="fullname" required minlength="3">
            </div>
            <br>

            <div>
                <label for="user_email">Email Address:</label>
                <input type="email" id="user_email" name="email" required>
            </div>
            <br>

            <div>
                <label for="user_pass">Password:</label>
                <input type="password" id="user_pass" name="password" required minlength="8">
            </div>
            <br>

            <div>
                <label for="user_pass_confirm">Confirm Password:</label>
                <input type="password" id="user_pass_confirm" name="confirm-password" required minlength="8">
            </div>
            <br>

            <div>
                <label for="birth_date">Date of Birth:</label>
                <input type="date" id="birth_date" name="dob" required>
            </div>
        </fieldset>

        <br>

        <fieldset>
            <legend>2. Contact &amp; Location</legend>

            <div>
                <label for="mobile_num">Phone Number:</label>
                <input type="tel" id="mobile_num" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Please enter phone number as: 059-123-4567">
            </div>
            <br>

            <div>
                <label for="city_select">City:</label>
                <select id="city_select" name="city">
                    <option value="">-- Select City --</option>
                    <option value="Gaza">Gaza</option>
                    <option value="North Gaza">North Gaza</option>
                    <option value="Deir al-Balah">Deir al-Balah</option>
                    <option value="Khan Younis">Khan Younis</option>
                    <option value="Rafah">Rafah</option>
                </select>
            </div>
            <br>

            <div>
                <label for="street_address">Full Address:</label><br>
                <textarea id="street_address" name="address" rows="4" cols="45"></textarea>
            </div>
        </fieldset>

        <br>

        <fieldset>
            <legend>3. Profile &amp; Interests</legend>

            <div>
                <p>Gender:</p>
                <input type="radio" id="gender_female" name="gender" value="female">
                <label for="gender_female">Female</label>
                <br>
                <input type="radio" id="gender_male" name="gender" value="male">
                <label for="gender_male">Male</label>
            </div>
            <br>

            <div>
                <p>Select Your Interests:</p>
                <input type="checkbox" id="int_web" name="interests" value="Web Development">
                <label for="int_web">Web Development</label><br>

                <input type="checkbox" id="int_cyber" name="interests" value="Cybersecurity">
                <label for="int_cyber">Cybersecurity</label><br>

                <input type="checkbox" id="int_ai" name="interests" value="Artificial Intelligence">
                <label for="int_ai">Artificial Intelligence</label><br>

                <input type="checkbox" id="int_networks" name="interests" value="Computer Networks">
                <label for="int_networks">Computer Networks</label><br>

                <input type="checkbox" id="int_uiux" name="interests" value="UI/UX Design">
                <label for="int_uiux">UI/UX Design</label>
            </div>
            <br>

            <div>
                <label for="experience_level">Technical Skill Level (1 to 10):</label>
                <input type="range" id="experience_level" name="skill" min="1" max="10" value="7">
            </div>
            <br>

            <div>
                <label for="avatar_upload">Upload Profile Picture:</label>
                <input type="file" id="avatar_upload" name="photo" accept="image/*">
            </div>
        </fieldset>

        <br>

        <div>
            <input type="checkbox" id="accept_terms" name="terms" required>
            <label for="accept_terms">I have read and agree to the Terms and Conditions.</label>
        </div>

        <br>

        <div>
            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Fields</button>
        </div>

    </form>

</body>
</html>
